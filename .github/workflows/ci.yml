name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Generator source and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.7" "pytest>=8" build
      - name: Test source tree
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            tests/test_generator_framework.py \
            tests/test_generator_primitives.py \
            tests/test_simple_epsilon.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Test installed wheel
        run: |
          python -m venv --system-site-packages .wheel-test
          .wheel-test/bin/python -m pip install --no-deps dist/*.whl
          .wheel-test/bin/python -m pytest \
            tests/test_generator_framework.py \
            tests/test_generator_primitives.py \
            tests/test_simple_epsilon.py

  model-contract:
    name: FLA passthrough contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Verify pinned upstream release
        run: |
          python -c "import fla; assert fla.__version__ == '0.5.1', fla.__version__"
      - name: Test project passthrough and Hugging Face registration
        run: |
          python -m pytest \
            tests/models/test_fla_causal_lm.py \
            -m "not cuda" \
            --strict-markers
